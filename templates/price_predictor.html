{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-body p-4">
                    <h2 class="text-center mb-4">
                        <i class="fas fa-calculator text-primary"></i> Property Price Predictor
                    </h2>
                    
                    <form id="predictForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Property Type</label>
                                <select class="form-select" id="property_type" name="property_type" required>
                                    <option value="">Select Type</option>
                                    <option value="flat">Flat</option>
                                    <option value="house">House</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Sector</label>
                                <select class="form-select" id="sector" name="sector" required>
                                    <option value="">Select Sector</option>
                                    {% for sector in sectors %}
                                    <option value="{{ sector }}">{{ sector }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">Bedrooms</label>
                                <select class="form-select" id="bedrooms" name="bedrooms" required>
                                    <option value="">Select</option>
                                    {% for bedroom in bedrooms %}
                                    <option value="{{ bedroom }}">{{ bedroom }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">Bathrooms</label>
                                <select class="form-select" id="bathroom" name="bathroom" required>
                                    <option value="">Select</option>
                                    {% for bathroom in bathrooms %}
                                    <option value="{{ bathroom }}">{{ bathroom }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">Balconies</label>
                                <select class="form-select" id="balcony" name="balcony" required>
                                    <option value="">Select</option>
                                    {% for balcony in balconies %}
                                    <option value="{{ balcony }}">{{ balcony }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Property Age</label>
                                <select class="form-select" id="property_age" name="property_age" required>
                                    <option value="">Select Age</option>
                                    {% for age in property_ages %}
                                    <option value="{{ age }}">{{ age }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Built Up Area (sq ft)</label>
                                <input type="number" class="form-control" id="built_up_area" name="built_up_area" 
                                       placeholder="Enter area" min="100" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Servant Room</label>
                                <select class="form-select" id="servant_room" name="servant_room" required>
                                    <option value="0">No</option>
                                    <option value="1">Yes</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Store Room</label>
                                <select class="form-select" id="store_room" name="store_room" required>
                                    <option value="0">No</option>
                                    <option value="1">Yes</option>
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">Furnishing</label>
                                <select class="form-select" id="furnishing_type" name="furnishing_type" required>
                                    <option value="">Select</option>
                                    {% for furnishing in furnishing_types %}
                                    <option value="{{ furnishing }}">{{ furnishing }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">Luxury Category</label>
                                <select class="form-select" id="luxury_category" name="luxury_category" required>
                                    <option value="">Select</option>
                                    {% for luxury in luxury_categories %}
                                    <option value="{{ luxury }}">{{ luxury }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">Floor Category</label>
                                <select class="form-select" id="floor_category" name="floor_category" required>
                                    <option value="">Select</option>
                                    {% for floor in floor_categories %}
                                    <option value="{{ floor }}">{{ floor }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-magic"></i> Predict Price
                            </button>
                        </div>
                    </form>

                    <div id="loading" class="loading">
                        <div class="spinner"></div>
                        <p>Predicting price...</p>
                    </div>

                    <div id="result" class="mt-4" style="display: none;">
                        <div class="alert alert-success text-center">
                            <h4><i class="fas fa-check-circle"></i> Predicted Price</h4>
                            <hr>
                            <h3 id="priceRange" class="text-primary"></h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
$(document).ready(function() {
    $('#predictForm').on('submit', function(e) {
        e.preventDefault();
        
        $('#loading').show();
        $('#result').hide();
        
        $.ajax({
            url: '/predict',
            type: 'POST',
            data: $(this).serialize(),
            success: function(response) {
                $('#loading').hide();
                $('#priceRange').text('₹' + response.low_price + ' Cr - ₹' + response.high_price + ' Cr');
                $('#result').show();
            },
            error: function() {
                $('#loading').hide();
                alert('Error predicting price. Please try again.');
            }
        });
    });
});
</script>
{% endblock %}
